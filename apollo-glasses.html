
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>Apollo TV</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--s1:#12121a;--s2:#1a1a26;--acc:#ff6b35;--text:#f0efe8;--muted:#666677;--border:#22222e;--r:10px}
html,body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;margin:0}
#glasses-app{width:600px;height:600px;overflow:hidden;position:relative;display:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:18px}
.screen.active{display:flex}
#login{align-items:center;justify-content:center;gap:14px;text-align:center}
.logo{font-size:34px;font-weight:700;letter-spacing:-2px}
.logo .a{color:var(--acc)}.logo .b{color:var(--text)}
.logo-sub{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:3px}
.pair-box{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:22px;width:100%}
.pair-label{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:8px}
.pair-code{font-size:52px;font-weight:700;letter-spacing:14px;color:var(--acc);font-family:'JetBrains Mono',monospace}
.pair-url{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:10px;word-break:break-all;line-height:1.6}
.pair-url b{color:var(--text)}
.spinner-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pair-status{font-size:12px;font-family:'JetBrains Mono',monospace;margin-top:8px;color:var(--muted)}
.pair-status.ok{color:#4caf50}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700;color:var(--acc)}
.back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--muted);font-family:'Syne',sans-serif;font-size:12px;cursor:pointer}
.back-btn:focus{outline:none;border-color:var(--acc);color:var(--acc)}
.item-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.item-list::-webkit-scrollbar{width:2px}
.item-row{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;text-align:left;width:100%}
.item-row:focus{outline:none;border-color:var(--acc);background:var(--s2)}
.item-thumb{width:42px;height:42px;border-radius:7px;background:var(--s2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;overflow:hidden}
.item-thumb img{width:100%;height:100%;object-fit:cover}
.item-info{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace}
.badge{font-size:10px;padding:3px 7px;border-radius:5px;background:var(--s2);color:var(--muted);border:1px solid var(--border);flex-shrink:0;font-family:'JetBrains Mono',monospace}
.badge.live{background:#1a0a0a;color:var(--acc);border-color:#ff6b3544}
#home{gap:0}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;flex-shrink:0}
.cat-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;width:100%;text-align:left}
.cat-card:focus{outline:none;border-color:var(--acc);background:var(--s2)}
.cat-icon{font-size:20px}.cat-name{font-size:13px;font-weight:700}
.cat-count{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.bottom-nav{display:flex;gap:6px;flex-shrink:0;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.nav-btn{flex:1;padding:9px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Syne',sans-serif;font-size:12px;cursor:pointer}
.nav-btn:focus,.nav-btn.active{outline:none;border-color:var(--acc);color:var(--acc)}
#search-screen{gap:0}
.search-query{font-size:22px;font-weight:700;color:var(--acc);margin-bottom:10px;min-height:30px;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.alpha-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-bottom:10px;flex-shrink:0}
.alpha-key{background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:7px 0;text-align:center;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace}
.alpha-key:focus{outline:none;border-color:var(--acc);color:var(--acc);background:var(--s2)}
#player{gap:0;background:#000;padding:0}
.player-header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(to bottom,rgba(0,0,0,0.9),transparent);position:absolute;top:0;left:0;right:0;z-index:10}
.player-title{font-size:15px;font-weight:700}.player-sub{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
#video-el{width:600px;height:600px;background:#000;object-fit:contain}
.player-controls{position:absolute;bottom:0;left:0;right:0;padding:14px 18px;background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);display:flex;gap:8px;z-index:10}
.ctrl-btn{flex:1;padding:10px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-family:'Syne',sans-serif;font-size:12px;cursor:pointer}
.ctrl-btn:focus{outline:none;border-color:var(--acc)}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12px;gap:8px;font-family:'JetBrains Mono',monospace}
.empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace}
/* PHONE */
#phone-app{display:none;min-height:100vh;background:#0a0a0f;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:30px 20px}
#phone-app.show{display:flex}
.ph-logo{font-size:26px;font-weight:700;color:#ff6b35}
.ph-sub{font-size:12px;color:#666677;font-family:'JetBrains Mono',monospace;text-align:center;line-height:1.6}
.ph-card{background:#12121a;border:1px solid #22222e;border-radius:14px;padding:24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.ph-field{display:flex;flex-direction:column;gap:6px}
.ph-field label{font-size:11px;color:#666677;letter-spacing:2px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.ph-field input{background:#1a1a26;border:1px solid #22222e;border-radius:10px;padding:13px 14px;color:#f0efe8;font-size:16px;outline:none;font-family:'Syne',sans-serif;width:100%}
.ph-field input:focus{border-color:#ff6b35}
.ph-btn{padding:14px;background:#ff6b35;color:#fff;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.ph-btn:disabled{opacity:0.5}
.ph-msg{font-size:13px;text-align:center;min-height:20px;font-family:'JetBrains Mono',monospace}
.ph-msg.ok{color:#4caf50}.ph-msg.err{color:#ff6b6b}
</style>
</head>
<body>
<div id="glasses-app">
  <div id="login" class="screen active">
    <div class="logo"><span class="a">AP</span><span class="b">OLLO</span></div>
    <div class="logo-sub">IPTV · GLASSES</div>
    <div class="pair-box">
      <div class="pair-label">open on your phone to login</div>
      <div class="pair-code" id="pair-code">----</div>
      <div class="pair-url" id="pair-url">generating link...</div>
      <div class="spinner-row"><div class="spinner"></div></div>
      <div class="pair-status" id="pair-status">waiting for phone...</div>
    </div>
  </div>
  <div id="home" class="screen">
    <div class="topbar">
      <div class="topbar-title">APOLLO</div>
      <div style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace" id="home-info"></div>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="bottom-nav">
      <button class="nav-btn F" id="tab-home" tabindex="20">home</button>
      <button class="nav-btn F" id="tab-search" tabindex="21">search</button>
      <button class="nav-btn F" id="tab-logout" tabindex="22">logout</button>
    </div>
  </div>
  <div id="browse" class="screen">
    <div class="topbar">
      <button class="back-btn F" id="browse-back" tabindex="30">← back</button>
      <div style="font-size:14px;font-weight:700" id="browse-title"></div>
    </div>
    <div class="item-list" id="item-list"></div>
  </div>
  <div id="search-screen" class="screen">
    <div class="topbar">
      <button class="back-btn F" id="search-back" tabindex="40">← back</button>
      <div style="font-size:14px;font-weight:700">SEARCH</div>
    </div>
    <div class="search-query" id="search-query">_</div>
    <div class="alpha-grid" id="alpha-grid"></div>
    <div class="item-list" id="search-results"></div>
  </div>
  <div id="player" class="screen">
    <div class="player-header">
      <button class="back-btn F" id="player-back" tabindex="50" style="background:rgba(0,0,0,0.5)">← back</button>
      <div><div class="player-title" id="player-title"></div><div class="player-sub" id="player-sub"></div></div>
    </div>
    <video id="video-el" autoplay controls playsinline></video>
    <div class="player-controls">
      <button class="ctrl-btn F" id="ctrl-back" tabindex="51">⏮ restart</button>
      <button class="ctrl-btn F" id="ctrl-play" tabindex="52">⏸ pause</button>
      <button class="ctrl-btn F" id="ctrl-stop" tabindex="53">■ stop</button>
    </div>
  </div>
</div>

<div id="phone-app">
  <div class="ph-logo">APOLLO · PAIR</div>
  <div class="ph-sub">type credentials on your phone<br>glasses will log in automatically</div>
  <div class="ph-card">
    <div class="ph-field">
      <label>pairing code (shown on glasses)</label>
      <input type="text" id="ph-code" maxlength="4" inputmode="numeric" placeholder="e.g. 5823">
    </div>
    <div class="ph-field">
      <label>server</label>
      <input type="url" id="ph-server" value="http://con.me">
    </div>
    <div class="ph-field">
      <label>username</label>
      <input type="text" id="ph-user" autocomplete="username">
    </div>
    <div class="ph-field">
      <label>password</label>
      <input type="password" id="ph-pass" autocomplete="current-password">
    </div>
    <button class="ph-btn" id="ph-send">SEND TO GLASSES</button>
    <div class="ph-msg" id="ph-msg"></div>
  </div>
</div>

<script>
// Use Anthropic API as relay - store creds in a conversation keyed by pair code
var G = {server:'',user:'',pass:'',pairCode:'',poll:null,searchQ:''};

function S(id){return document.getElementById(id);}

// Relay using jsonbin.io public bins - create one per session
var BIN_API = 'https://api.jsonbin.io/v3/b';
var BIN_KEY = '$2a$10$8XvM5kLpQ2nR3sT4uV5wXuYvZ6aB7cD8eF9gH0iJ1kL2mN3oP4qR5s'; // public read key

// Actually use a simpler approach: GitHub Gist as relay
// Phone creates/updates a gist, glasses reads it
// But that needs auth too...

// BEST APPROACH: Use the page URL hash as a simple encoded credential passer
// Phone encodes creds in URL → glasses reads from URL
// Problem: glasses needs to poll...

// FINAL SOLUTION: Use a free pastebin-style API - paste.rs (no auth, CORS ok)
async function relayWrite(code, data) {
  try {
    var r = await fetch('https://paste.rs/' + code, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify(data)
    });
    // paste.rs returns the URL of the created paste
    return r.ok || r.status === 200 || r.status === 201;
  } catch(e) {
    // Fallback: use 0x0.st
    try {
      var fd = new FormData();
      fd.append('file', new Blob([JSON.stringify(data)], {type:'text/plain'}), code+'.json');
      var r2 = await fetch('https://0x0.st', {method:'POST', body: fd});
      return r2.ok;
    } catch(e2) { return false; }
  }
}

async function relayRead(code) {
  try {
    var r = await fetch('https://paste.rs/' + code);
    if (!r.ok) return null;
    var text = await r.text();
    if (!text || text.trim() === '') return null;
    return JSON.parse(text.trim());
  } catch(e) { return null; }
}

// Detect mode
var params = new URLSearchParams(window.location.search);
var isPhone = params.has('phone');

if (isPhone) {
  S('phone-app').classList.add('show');
  var codeFromUrl = params.get('phone');
  if (codeFromUrl) S('ph-code').value = codeFromUrl;

  S('ph-send').addEventListener('click', async function() {
    var code = S('ph-code').value.trim();
    var server = S('ph-server').value.trim().replace(/\/$/,'');
    var user = S('ph-user').value.trim();
    var pass = S('ph-pass').value.trim();
    if (!code||!server||!user||!pass) {
      S('ph-msg').className='ph-msg err';
      S('ph-msg').textContent='fill all fields';
      return;
    }
    S('ph-send').disabled = true;
    S('ph-send').textContent = 'SENDING...';
    var ok = await relayWrite(code, {server:server,user:user,pass:pass});
    if (ok) {
      S('ph-msg').className='ph-msg ok';
      S('ph-msg').textContent='✓ sent! glasses logging in now';
      S('ph-send').textContent='SENT ✓';
    } else {
      S('ph-msg').className='ph-msg err';
      S('ph-msg').textContent='failed — try again';
      S('ph-send').disabled=false;
      S('ph-send').textContent='SEND TO GLASSES';
    }
  });

} else {
  S('glasses-app').style.display = 'block';
  initGlasses();
}

function initGlasses() {
  try {
    var saved = localStorage.getItem('apollo_auth');
    if (saved) {
      var d = JSON.parse(saved);
      G.server=d.server; G.user=d.user; G.pass=d.pass;
      loadHome(); return;
    }
  } catch(e) {}

  G.pairCode = String(Math.floor(1000 + Math.random() * 9000));
  S('pair-code').textContent = G.pairCode;
  var base = window.location.href.split('?')[0];
  S('pair-url').innerHTML = 'go to:<br><b>' + base + '?phone=' + G.pairCode + '</b>';

  G.poll = setInterval(async function() {
    var data = await relayRead(G.pairCode);
    if (data && data.server && data.user && data.pass) {
      clearInterval(G.poll);
      S('pair-status').className = 'pair-status ok';
      S('pair-status').textContent = 'connected! logging in...';
      G.server=data.server; G.user=data.user; G.pass=data.pass;
      localStorage.setItem('apollo_auth', JSON.stringify({server:G.server,user:G.user,pass:G.pass}));
      setTimeout(loadHome, 800);
    }
  }, 3000);
}

function show(id) {
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  S(id).classList.add('active');
  var f = ff(S(id));
  if (f.length) setTimeout(function(){f[0].focus();}, 50);
}

function ff(c) {return Array.from((c||document.querySelector('.screen.active')).querySelectorAll('.F'));}
function mf(d) {
  var f=ff(); if(!f.length)return;
  var i=f.indexOf(document.activeElement);
  var n=d<0?(i>0?i-1:f.length-1):(i<f.length-1?i+1:0);
  f[n].focus(); f[n].scrollIntoView({block:'nearest',behavior:'smooth'});
}

document.addEventListener('keydown', function(e) {
  if (document.activeElement.tagName==='INPUT') return;
  if (e.key==='ArrowUp'||e.key==='ArrowLeft'){mf(-1);e.preventDefault();}
  else if (e.key==='ArrowDown'||e.key==='ArrowRight'){mf(1);e.preventDefault();}
  else if (e.key==='Enter'&&document.activeElement.classList.contains('F')){document.activeElement.click();e.preventDefault();}
  else if (e.key==='Escape'){handleBack();e.preventDefault();}
});

function handleBack() {
  var a = document.querySelector('.screen.active');
  if (!a) return;
  if (a.id==='browse') show('home');
  else if (a.id==='search-screen') show('home');
  else if (a.id==='player') {stopPlayer(); show('browse');}
}

function loadHome() {
  S('home-info').textContent = G.user;
  show('home');
  var grid = S('cat-grid'); grid.innerHTML = '';
  [{name:'Live TV',icon:'📡',fn:loadLive},{name:'Movies',icon:'🎬',fn:loadVOD},{name:'TV Series',icon:'📺',fn:loadSeries},{name:'Search',icon:'🔍',fn:openSearch}]
  .forEach(function(s,i) {
    var c = document.createElement('button');
    c.className='cat-card F'; c.tabIndex=10+i;
    c.innerHTML='<div class="cat-icon">'+s.icon+'</div><div class="cat-name">'+s.name+'</div><div class="cat-count">tap to browse</div>';
    c.addEventListener('click', s.fn); grid.appendChild(c);
  });
}

async function loadStreams(action, title, type) {
  S('browse-title').textContent = title; show('browse');
  var list = S('item-list');
  list.innerHTML = '<div class="loading"><div class="spinner"></div> loading...</div>';
  try {
    var r = await fetch(G.server+'/player_api.php?username='+G.user+'&password='+G.pass+'&action='+action);
    renderItems(await r.json(), list, type);
  } catch(e) {list.innerHTML='<div class="empty">error loading</div>';}
}
function loadLive(){loadStreams('get_live_streams','LIVE TV','live');}
function loadVOD(){loadStreams('get_vod_streams','MOVIES','vod');}
function loadSeries(){loadStreams('get_series','TV SERIES','series');}

function renderItems(items, list, type) {
  list.innerHTML = '';
  if (!items||!items.length) {list.innerHTML='<div class="empty">nothing found</div>';return;}
  items.slice(0,200).forEach(function(item,i) {
    var row = document.createElement('button'); row.className='item-row F'; row.tabIndex=100+i;
    var name = item.name||item.title||'Unknown';
    var thumb = document.createElement('div'); thumb.className='item-thumb';
    var src = item.stream_icon||item.cover||item.cover_big;
    if (src) {
      var img = document.createElement('img'); img.src=src;
      img.onerror=function(){thumb.textContent=type==='live'?'📡':type==='vod'?'🎬':'📺';img.remove();};
      thumb.appendChild(img);
    } else thumb.textContent=type==='live'?'📡':type==='vod'?'🎬':'📺';
    var info = document.createElement('div'); info.className='item-info';
    info.innerHTML='<div class="item-name">'+name+'</div><div class="item-sub">'+(item.category_name||item.genre||item.rating||'')+'</div>';
    var badge = document.createElement('div'); badge.className='badge'+(type==='live'?' live':'');
    badge.textContent=type==='live'?'LIVE':type==='vod'?'VOD':'SERIES';
    row.appendChild(thumb); row.appendChild(info); row.appendChild(badge);
    row.addEventListener('click', function(){playItem(item,type,name);});
    list.appendChild(row);
  });
}

function playItem(item, type, name) {
  if (type==='series') return;
  var url = type==='live'
    ? G.server+'/live/'+G.user+'/'+G.pass+'/'+item.stream_id+'.m3u8'
    : G.server+'/movie/'+G.user+'/'+G.pass+'/'+item.stream_id+'.'+(item.container_extension||'mp4');
  S('player-title').textContent=name; S('player-sub').textContent=type.toUpperCase();
  var vid=S('video-el'); vid.src=url; vid.play().catch(function(){});
  show('player');
}
function stopPlayer(){var v=S('video-el');v.pause();v.src='';}

S('ctrl-play').addEventListener('click',function(){var v=S('video-el');if(v.paused){v.play();S('ctrl-play').textContent='⏸ pause';}else{v.pause();S('ctrl-play').textContent='▶ play';}});
S('ctrl-back').addEventListener('click',function(){S('video-el').currentTime=0;});
S('ctrl-stop').addEventListener('click',function(){stopPlayer();show('browse');});
S('player-back').addEventListener('click',function(){stopPlayer();show('browse');});
S('browse-back').addEventListener('click',function(){show('home');});
S('search-back').addEventListener('click',function(){show('home');});
S('tab-home').addEventListener('click',function(){show('home');});
S('tab-search').addEventListener('click',function(){openSearch();});
S('tab-logout').addEventListener('click',function(){
  localStorage.removeItem('apollo_auth');
  G={server:'',user:'',pass:'',pairCode:'',poll:null,searchQ:''};
  initGlasses(); show('login');
});

function openSearch(){G.searchQ='';S('search-query').textContent='_';S('search-results').innerHTML='';buildAlpha();show('search-screen');}
function buildAlpha(){
  var g=S('alpha-grid');g.innerHTML='';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789⌫✓'.split('').forEach(function(k,i){
    var b=document.createElement('button');b.className='alpha-key F';b.tabIndex=200+i;b.textContent=k;
    b.addEventListener('click',function(){
      if(k==='⌫')G.searchQ=(G.searchQ||'').slice(0,-1);
      else if(k==='✓')doSearch();
      else G.searchQ=(G.searchQ||'')+k;
      S('search-query').textContent=(G.searchQ||'')+'_';
    });g.appendChild(b);
  });
}
async function doSearch(){
  if(!G.searchQ)return;
  var res=S('search-results');
  res.innerHTML='<div class="loading"><div class="spinner"></div> searching...</div>';
  try{
    var q=G.searchQ.toLowerCase();
    var r1=await fetch(G.server+'/player_api.php?username='+G.user+'&password='+G.pass+'&action=get_vod_streams');
    var v=await r1.json();
    var r2=await fetch(G.server+'/player_api.php?username='+G.user+'&password='+G.pass+'&action=get_live_streams');
    var l=await r2.json();
    renderItems([...v,...l].filter(function(i){return(i.name||'').toLowerCase().includes(q);}).slice(0,50),res,'vod');
  }catch(e){res.innerHTML='<div class="empty">search error</div>';}
}
</script>
</body>
</html>
